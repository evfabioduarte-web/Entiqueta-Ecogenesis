<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enriqueta RFID - Captura JPG & Leitura</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root { --primary: #4f46e5; --bg: #f9fafb; --card: #ffffff; --text: #1f2937; --border: #e5e7eb; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 16px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        h2, h3 { color: var(--primary); margin-top: 0; }
        button { background: var(--primary); color: white; border: none; border-radius: 6px; padding: 12px; font-size: 1rem; width: 100%; font-weight: bold; cursor: pointer; margin-top: 8px; }
        button.sec { background: #6b7280; }
        input { width: 100%; padding: 10px; margin: 6px 0 12px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
        .row { display: flex; gap: 10px; }
        .col { flex: 1; }
        #reader { width: 100%; margin-bottom: 12px; display: none; }
        #preview { max-width: 100px; max-height: 100px; border-radius: 6px; display: none; margin-top: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th, td { border: 1px solid var(--border); padding: 6px; text-align: left; }
        th { background: #f3f4f6; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Enriqueta RFID</h2>
        <button onclick="iniciarLeitor()">📷 Ler Código de Barras</button>
        <div id="reader"></div>
        <button id="btn-stop" class="sec" onclick="pararLeitor()" style="display:none;">Parar Leitor</button>
    </div>

    <div class="card">
        <h3>📦 Cadastrar Produto</h3>
        <form onsubmit="salvar(event)">
            <label>Código do Produto</label>
            <input type="text" id="codigo" required placeholder="Digite ou leia o código">

            <label>Descrição / Produto</label>
            <input type="text" id="descricao" required placeholder="Ex: Caderno A5">

            <div class="row">
                <div class="col"><label>Categoria</label><input type="text" id="categoria" value="Geral"></div>
                <div class="col"><label>Marca</label><input type="text" id="marca" value="Genérica"></div>
            </div>

            <div class="row">
                <div class="col"><label>Qtd</label><input type="number" id="qtd" value="1"></div>
                <div class="col"><label>Preço (€)</label><input type="number" step="0.01" id="preco" value="0.00"></div>
            </div>

            <label>📷 Foto do Produto (JPG)</label>
            <input type="file" id="foto-input" accept="image/jpeg, image/png" capture="environment" onchange="carregarFoto(event)">
            <img id="preview" alt="Pré-visualização">
            <input type="hidden" id="foto-base64">

            <button type="submit">Salvar na Planilha</button>
        </form>
    </div>

    <div class="card">
        <h3>📊 Estoque</h3>
        <button class="sec" onclick="exportarCSV()">📥 Exportar para CSV (Excel)</button>
        <div style="overflow-x:auto;">
            <table id="tabela">
                <thead>
                    <tr><th>Foto</th><th>Código</th><th>Produto</th><th>Qtd</th><th>Preço</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let db;
    let html5QrCode;

    const request = indexedDB.open("EnriquetaDB", 1);
    request.onsuccess = (e) => { db = e.target.result; carregarTabela(); };
    request.onupgradeneeded = (e) => { e.target.result.createObjectStore("produtos", { keyPath: "codigo" }); };

    function iniciarLeitor() {
        document.getElementById("reader").style.display = "block";
        document.getElementById("btn-stop").style.display = "block";
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
            document.getElementById("codigo").value = text;
            pararLeitor();
            alert("Código Lido: " + text);
        }).catch(() => alert("Erro ao abrir a câmara. Verifique as permissões."));
    }

    function pararLeitor() {
        if(html5QrCode) html5QrCode.stop().then(() => html5QrCode.clear());
        document.getElementById("reader").style.display = "none";
        document.getElementById("btn-stop").style.display = "none";
    }

    function carregarFoto(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                document.getElementById("foto-base64").value = evt.target.result;
                const img = document.getElementById("preview");
                img.src = evt.target.result;
                img.style.display = "block";
            };
            reader.readAsDataURL(file);
        }
    }

    function salvar(e) {
        e.preventDefault();
        const p = {
            codigo: document.getElementById("codigo").value,
            descricao: document.getElementById("descricao").value,
            categoria: document.getElementById("categoria").value,
            marca: document.getElementById("marca").value,
            qtd: document.getElementById("qtd").value,
            preco: document.getElementById("preco").value,
            foto: document.getElementById("foto-base64").value
        };

        const tx = db.transaction(["produtos"], "readwrite");
        tx.objectStore("produtos").put(p);
        tx.oncomplete = () => {
            alert("Produto gravado!");
            e.target.reset();
            document.getElementById("preview").style.display = "none";
            carregarTabela();
        };
    }

    function carregarTabela() {
        if(!db) return;
        const tx = db.transaction(["produtos"], "readonly");
        tx.objectStore("produtos").getAll().onsuccess = (e) => {
            const tbody = document.querySelector("#tabela tbody");
            tbody.innerHTML = "";
            e.target.result.forEach(p => {
                const img = p.foto ? `<img src="${p.foto}" width="35" height="35" style="object-fit:cover;">` : "-";
                tbody.innerHTML += `<tr><td>${img}</td><td>${p.codigo}</td><td>${p.descricao}</td><td>${p.qtd}</td><td>${p.preco}€</td></tr>`;
            });
        };
    }

    function exportarCSV() {
        const tx = db.transaction(["produtos"], "readonly");
        tx.objectStore("produtos").getAll().onsuccess = (e) => {
            let csv = "Codigo,Descricao,Categoria,Marca,Quantidade,Preco,Foto_Base64\n";
            e.target.result.forEach(p => {
                csv += `"${p.codigo}","${p.descricao}","${p.categoria}","${p.marca}",${p.qtd},${p.preco},"${p.foto || ''}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "estoque_enriqueta.csv";
            a.click();
        };
    }
</script>
</body>
</html>
